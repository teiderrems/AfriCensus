@if (open) {
      <section class="modal-backdrop" role="presentation" (click)="onBackdropClick($event)">
        <!-- Mode Formulaire -->
        @if (isForm) {
          <form
            class="modal"
            role="dialog"
            aria-modal="true"
            [attr.aria-labelledby]="titleId"
            (ngSubmit)="$event.preventDefault(); submitted.emit()"
          >
            <ng-container *ngTemplateOutlet="modalInner" />
          </form>
        }
        <!-- Mode Standard -->
        @else {
          <article
            class="modal"
            role="dialog"
            aria-modal="true"
            [attr.aria-labelledby]="titleId"
          >
            <ng-container *ngTemplateOutlet="modalInner" />
          </article>
        }
      </section>
    }

    <ng-template #modalInner>
      <header class="modal-head" [class.danger]="variant === 'danger'" [class.warning]="variant === 'warning'">
        <div class="modal-title-wrapper">
          @if (variant === 'danger') {
            <lucide-icon name="alert-triangle" class="modal-icon text-error"></lucide-icon>
          } @else if (variant === 'warning') {
            <lucide-icon name="alert-circle" class="modal-icon text-warning"></lucide-icon>
          }
          <div>
            <h2 [id]="titleId">{{ title }}</h2>
            @if (subtitle) {
              <p>{{ subtitle }}</p>
            }
          </div>
        </div>
        <acl-button variant="icon-action" type="button" [aclTooltip]="i18n.t('a11y.closeMenu')" (click)="closed.emit()">
          <lucide-icon name="x"></lucide-icon>
        </acl-button>
      </header>
      <div class="modal-body">
        <ng-content />
      </div>
      <footer class="modal-actions">
        <ng-content select="[modal-actions]" />
      </footer>
    </ng-template>
