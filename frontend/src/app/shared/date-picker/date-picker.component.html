<div class="date-picker-wrapper">
  <button type="button" class="date-trigger" [disabled]="disabled" (click)="toggleOpen()">
    <span [class.has-value]="!!value">{{ displayValue() }}</span>
    <lucide-icon name="calendar"></lucide-icon>
  </button>

  @if (isOpen()) {
    <div 
      class="popover" 
      [class.open-above]="openAbove()"
      [style.top.px]="popoverTop()" 
      [style.left.px]="popoverLeft()"
    >
      <div class="calendar-header">
        <button type="button" class="nav-btn" [aclTooltip]="i18n.t('action.previous')" (click)="prevMonth($event)">
          <lucide-icon name="chevron-left"></lucide-icon>
        </button>
        <div class="month-year-selects">
          <select class="header-select" [ngModel]="currentMonth().getMonth()" (ngModelChange)="setMonth($event)" (click)="$event.stopPropagation()">
            @for (m of monthOptions(); track m.value) {
              <option [value]="m.value">{{ m.label }}</option>
            }
          </select>
          <select class="header-select" [ngModel]="currentMonth().getFullYear()" (ngModelChange)="setYear($event)" (click)="$event.stopPropagation()">
            @for (y of yearOptions(); track y) {
              <option [value]="y">{{ y }}</option>
            }
          </select>
        </div>
        <button type="button" class="nav-btn" [aclTooltip]="i18n.t('action.next')" (click)="nextMonth($event)">
          <lucide-icon name="chevron-right"></lucide-icon>
        </button>
      </div>

      <div class="calendar-grid">
        @for (dayName of daysOfWeek(); track dayName) {
          <div class="weekday">{{ dayName }}</div>
        }
        @for (day of calendarDays(); track day.formatted) {
          <button
            type="button"
            class="day"
            [class.current-month]="day.isCurrentMonth"
            [class.other-month]="!day.isCurrentMonth"
            [class.selected]="day.isSelected"
            [class.today]="day.isToday"
            (click)="selectDate(day, $event)"
          >
            {{ day.date.getDate() }}
          </button>
        }
      </div>
    </div>
  }
</div>
