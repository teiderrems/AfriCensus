@if (open) {
      <div class="drawer-backdrop" aria-hidden="true" (click)="closed.emit()"></div>
      <aside class="detail-drawer" role="dialog" aria-modal="true" [attr.aria-label]="title">
        <header>
          <div>
            <strong>{{ title }}</strong>
            @if (subtitle) {
              <span>{{ subtitle }}</span>
            }
          </div>
          <acl-button variant="drawer-close" type="button" [aclTooltip]="i18n.t('a11y.closeMenu')" (click)="closed.emit()">
            <lucide-icon name="x"></lucide-icon>
          </acl-button>
        </header>

        <dl>
          @for (item of items; track item.label + '-' + $index) {
            <div>
              <dt>{{ item.label }}</dt>
              <dd>{{ display(item.value) }}</dd>
            </div>
          }
        </dl>

        <ng-content />
      </aside>
    }
