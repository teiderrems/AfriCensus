<div class="page-size-control">
  <label [for]="controlId" class="page-size-label">{{ i18n.t('common.perPage') }}</label>
  <acl-select [id]="controlId" [name]="controlId" [ngModel]="value" (ngModelChange)="valueChange.emit($event)" [options]="[{label: '10', value: 10}, {label: '25', value: 25}, {label: '50', value: 50}, {label: '100', value: 100}]"></acl-select>
</div>
