<section class="login-page">
  <div class="login-panel">
    <div class="brand" style="flex-direction: column; text-align: center; gap: 8px; margin-bottom: 24px;">
      <lucide-icon name="key" [size]="48" color="var(--primary)"></lucide-icon>
      <div>
        <h1 style="font-size: 28px;">{{ i18n.t('auth.resetPassword.title') }}</h1>
        <p>{{ i18n.t('auth.resetPassword.subtitle') }}</p>
      </div>
    </div>

    <form (ngSubmit)="submit()">
      @if (error()) {
        <div class="error-msg" role="alert">
          <lucide-icon name="alert-triangle" [size]="16"></lucide-icon>
          <span>{{ error() }}</span>
        </div>
      }
      
      @if (success()) {
        <div class="success-msg" role="alert">
          <lucide-icon name="check-circle" [size]="16"></lucide-icon>
          <span>{{ success() }}</span>
        </div>
      }

      <div class="field">
        <label for="password">{{ i18n.t('auth.resetPassword.password') }}</label>
        <div class="input-with-icon">
          <input id="password" [type]="showPassword() ? 'text' : 'password'" name="password" [(ngModel)]="password" required [disabled]="!!success()" minlength="8" />
          <button type="button" class="input-icon-btn" (click)="showPassword.set(!showPassword())" tabindex="-1">
            <lucide-icon [name]="showPassword() ? 'eye-off' : 'eye'" [size]="20"></lucide-icon>
          </button>
        </div>
      </div>

      <div class="field">
        <label for="confirmPassword">{{ i18n.t('auth.resetPassword.confirm') }}</label>
        <div class="input-with-icon">
          <input id="confirmPassword" [type]="showConfirmPassword() ? 'text' : 'password'" name="confirmPassword" [(ngModel)]="confirmPassword" required [disabled]="!!success()" minlength="8" />
          <button type="button" class="input-icon-btn" (click)="showConfirmPassword.set(!showConfirmPassword())" tabindex="-1">
            <lucide-icon [name]="showConfirmPassword() ? 'eye-off' : 'eye'" [size]="20"></lucide-icon>
          </button>
        </div>
      </div>

      <div class="field" style="margin-top: 12px; gap: 12px;">
        @if (validationError) {
          <small class="error" style="color: var(--error);">{{ validationError }}</small>
        }
        <acl-button type="submit" variant="primary" [loading]="loading()" [disabled]="!password || !confirmPassword || !!validationError || !!success()">
          <lucide-icon [name]="loading() ? 'loader' : 'check'" [class.animate-spin]="loading()"></lucide-icon>
          {{ i18n.t('auth.resetPassword.submit') }}
        </acl-button>
        <acl-button type="button" variant="secondary" routerLink="/login">
          {{ i18n.t('auth.forgotPassword.back') }}
        </acl-button>
      </div>
    </form>
  </div>
</section>
