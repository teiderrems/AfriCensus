<section class="login-page">
  <div class="login-panel">
    <div class="header">
      <lucide-icon name="shield-alert" [size]="48" color="#0066cc"></lucide-icon>
      <h1>{{ i18n.t('auth.forgotPassword.title') }}</h1>
      <p>{{ i18n.t('auth.forgotPassword.subtitle') }}</p>
    </div>

    <form (ngSubmit)="submit()">
      @if (error()) {
        <div class="error-msg" role="alert">
          <lucide-icon name="alert-triangle" [size]="16"></lucide-icon>
          <span>{{ error() }}</span>
        </div>
      }
      
      @if (success()) {
        <div class="success-msg" role="alert">
          <lucide-icon name="check-circle" [size]="16"></lucide-icon>
          <span>{{ success() }}</span>
        </div>
      }

      <div class="form-group">
        <label for="identifier">{{ i18n.t('auth.forgotPassword.identifier') }}</label>
        <input id="identifier" type="text" name="identifier" [(ngModel)]="identifier" required [disabled]="!!success()" />
      </div>

      <div class="actions">
        <acl-button type="submit" variant="primary" [loading]="loading()" [disabled]="!identifier || !!success()">
          <lucide-icon [name]="loading() ? 'loader' : 'send'" [class.animate-spin]="loading()"></lucide-icon>
          {{ i18n.t('auth.forgotPassword.submit') }}
        </acl-button>
      </div>

      <p class="hint">
        <a routerLink="/login">{{ i18n.t('auth.forgotPassword.back') }}</a>
      </p>
    </form>
  </div>
</section>
