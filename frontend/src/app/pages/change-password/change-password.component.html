<section class="login-page">
  <div class="login-panel">
    <div class="brand" style="flex-direction: column; text-align: center; gap: 8px; margin-bottom: 24px;">
      <lucide-icon name="lock-keyhole" [size]="48" color="var(--primary)"></lucide-icon>
      <div>
        <h1 style="font-size: 28px;">{{ i18n.t('auth.changePassword.title') }}</h1>
        <p>{{ i18n.t('auth.changePassword.subtitle') }}</p>
      </div>
    </div>

    <form (ngSubmit)="submit()">
      @if (error()) {
        <div class="error-msg" role="alert">
          <lucide-icon name="alert-triangle" [size]="16"></lucide-icon>
          <span>{{ error() }}</span>
        </div>
      }
      
      @if (success()) {
        <div class="success-msg" role="alert">
          <lucide-icon name="check-circle" [size]="16"></lucide-icon>
          <span>{{ success() }}</span>
        </div>
      }

      <div class="field">
        <label for="oldPassword">{{ i18n.t('auth.changePassword.oldPassword') }}</label>
        <div class="input-with-icon">
          <input id="oldPassword" [type]="showOldPassword() ? 'text' : 'password'" name="oldPassword" [(ngModel)]="oldPassword" required [disabled]="!!success() || loading()" />
          <button type="button" class="input-icon-btn" (click)="showOldPassword.set(!showOldPassword())" tabindex="-1">
            <lucide-icon [name]="showOldPassword() ? 'eye-off' : 'eye'" [size]="20"></lucide-icon>
          </button>
        </div>
      </div>

      <div class="field">
        <label for="newPassword">{{ i18n.t('auth.resetPassword.password') }}</label>
        <div class="input-with-icon">
          <input id="newPassword" [type]="showNewPassword() ? 'text' : 'password'" name="newPassword" [(ngModel)]="newPassword" required [disabled]="!!success() || loading()" minlength="8" />
          <button type="button" class="input-icon-btn" (click)="showNewPassword.set(!showNewPassword())" tabindex="-1">
            <lucide-icon [name]="showNewPassword() ? 'eye-off' : 'eye'" [size]="20"></lucide-icon>
          </button>
        </div>
      </div>

      <div class="field">
        <label for="confirmPassword">{{ i18n.t('auth.resetPassword.confirm') }}</label>
        <div class="input-with-icon">
          <input id="confirmPassword" [type]="showConfirmPassword() ? 'text' : 'password'" name="confirmPassword" [(ngModel)]="confirmPassword" required [disabled]="!!success() || loading()" minlength="8" />
          <button type="button" class="input-icon-btn" (click)="showConfirmPassword.set(!showConfirmPassword())" tabindex="-1">
            <lucide-icon [name]="showConfirmPassword() ? 'eye-off' : 'eye'" [size]="20"></lucide-icon>
          </button>
        </div>
      </div>

      <div class="field" style="margin-top: 12px; gap: 12px;">
        @if (validationError) {
          <small class="error" style="color: var(--error);">{{ validationError }}</small>
        }
        <acl-button type="submit" variant="primary" icon="check" [disabled]="!oldPassword || !newPassword || !confirmPassword || !!validationError || !!success() || loading()">
          {{ i18n.t('auth.resetPassword.submit') }}
        </acl-button>
        <acl-button type="button" variant="secondary" routerLink="/portal">
          {{ i18n.t('action.cancel') }}
        </acl-button>
      </div>
    </form>
  </div>
</section>
