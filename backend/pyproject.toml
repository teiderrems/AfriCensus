[project]
name = "africensus-link-api"
version = "0.1.0"
description = "AfriCensus Link FastAPI backend"
authors = [{ name = "AfriCensus Team", email = "dev@africensus.local" }]
readme = "README.md"
requires-python = ">=3.13,<4.0"

dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "pydantic==2.11.7",
  "python-multipart==0.0.20",
  "httpx==0.28.1",
  "sqlalchemy==2.0.41",
  "psycopg>=3.2",
  "psycopg-binary>=3.2",
  "pydantic-settings==2.10.1",
  "alembic==1.14.0",
  "PyJWT==2.10.1"
]

[project.scripts]
africensus-api = "app.main:main"
africensus-migrate = "app.cli.migrate:main"
africensus-makemigrations = "app.cli.migrate:makemigrations"
africensus-reset = "app.cli.migrate:reset"
africensus-seed = "app.cli.migrate:seed"

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = "8.4.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
