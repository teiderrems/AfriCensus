[project]
name = "africensus-link-api"
version = "0.1.0"
description = "AfriCensus Link FastAPI backend"
authors = [{ name = "AfriCensus Team", email = "dev@africensus.local" }]
readme = "README.md"
requires-python = ">=3.13,<4.0"

dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "pydantic>=2.11.7",
  "python-multipart==0.0.20",
  "httpx==0.28.1",
  "sqlalchemy==2.0.41",
  "psycopg>=3.2",
  "psycopg-binary>=3.2",
  "psycopg2-binary>=2.9.9",
  "pydantic-settings==2.10.1",
  "alembic==1.14.0",
  "PyJWT==2.10.1",
  "orjson (>=3.11.9,<4.0.0)",
  "google-api-python-client (>=2.198.0,<3.0.0)",
  "google-auth (>=2.56.2,<3.0.0)",
  "email-validator>=2.2.0",
  "aiosmtplib (>=5.1.2,<6.0.0)",
  "jinja2 (>=3.1.6,<4.0.0)",
  "apscheduler (>=3.11.3,<4.0.0)",
  "openpyxl (>=3.1.5,<4.0.0)"
]

[project.scripts]
africensus-api = "app.main:main"
africensus-migrate = "app.cli.migrate:main"
africensus-makemigrations = "app.cli.migrate:makemigrations"
africensus-reset = "app.cli.migrate:reset"
africensus-seed = "app.cli.migrate:seed"

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = "8.4.1"
ruff = "^0.16.1"
pytest-cov = "^7.1.0"
pytest-asyncio = "^1.4.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
