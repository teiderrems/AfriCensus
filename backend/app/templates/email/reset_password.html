<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ t['email.reset.subject'] }}</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { background-color: #ffffff; padding: 30px; border-radius: 8px; max-width: 600px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #2c3e50; font-size: 24px; margin: 0; }
        .content { color: #555555; line-height: 1.6; font-size: 16px; }
        .button { display: inline-block; padding: 12px 24px; background-color: #007bff; color: #ffffff !important; text-decoration: none; border-radius: 4px; font-weight: bold; margin-top: 20px; }
        .footer { text-align: center; margin-top: 30px; font-size: 12px; color: #999999; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{{ app_name }}</h1>
        </div>
        <div class="content">
            <p>{{ t['email.reset.hello'] }} <strong>{{ user_name }}</strong>,</p>
            <p>{{ t['email.reset.body'] }}</p>
            <div style="text-align: center;">
                <a href="{{ reset_link }}" class="button">{{ t['email.reset.button'] }}</a>
            </div>
            <p style="margin-top: 30px; font-size: 14px;">{{ t['email.reset.ignore'] }}</p>
        </div>
        <div class="footer">
            <p>{{ t['email.reset.auto'] }}</p>
            <p>&copy; 2026 {{ app_name }}.</p>
        </div>
    </div>
</body>
</html>
