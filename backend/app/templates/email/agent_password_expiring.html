<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ t['email.mgr.subject'] }}</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
        <h2 style="color: #e67e22;">{{ t['email.mgr.subject'] }}</h2>
        <p>{{ t['email.mgr.hello'] }} {{ manager_name }},</p>
        <p>{{ t['email.mgr.body1'] }} <strong>{{ agent_name }}</strong> {{ t['email.mgr.body2'] }} <strong>{{ days_left }} {{ t['email.expire.body2'] }}</strong>.</p>
        <p>{{ t['email.mgr.block'] }}</p>
        <p>{{ t['email.mgr.remind'] }}</p>
        <hr style="border: none; border-top: 1px solid #eee; margin: 30px 0;">
        <p style="font-size: 12px; color: #999;">
            {{ t['email.reset.auto'] }}
        </p>
    </div>
</body>
</html>
