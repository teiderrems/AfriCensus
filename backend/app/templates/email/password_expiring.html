<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ t['email.expire.subject'] }}</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
        <h2 style="color: #2c3e50;">{{ t['email.expire.subject'] }}</h2>
        <p>{{ t['email.expire.hello'] }} {{ name }},</p>
        <p>{{ t['email.expire.body1'] }} <strong>{{ days_left }} {{ t['email.expire.body2'] }}</strong>.</p>
        <p>{{ t['email.expire.body3'] }}</p>
        <div style="text-align: center; margin: 30px 0;">
            <a href="{{ reset_link }}" style="background-color: #3498db; color: white; padding: 12px 25px; text-decoration: none; border-radius: 4px; display: inline-block;">
                {{ t['email.expire.button'] }}
            </a>
        </div>
        <p>{{ t['email.expire.block'] }}</p>
        <hr style="border: none; border-top: 1px solid #eee; margin: 30px 0;">
        <p style="font-size: 12px; color: #999;">
            {{ t['email.reset.auto'] }}
        </p>
    </div>
</body>
</html>
