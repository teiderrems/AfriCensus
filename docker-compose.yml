services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-africensus}"
      POSTGRES_USER: "${POSTGRES_USER:-africensus}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-africensus}"
    volumes:
      - africensus_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      AFRICENSUS_SECRET_KEY: "${AFRICENSUS_SECRET_KEY:-dev-secret-change-me}"
      AFRICENSUS_ACCESS_TOKEN_TTL: "${AFRICENSUS_ACCESS_TOKEN_TTL:-3600}"
      AFRICENSUS_REFRESH_TOKEN_TTL: "${AFRICENSUS_REFRESH_TOKEN_TTL:-604800}"
      PORT: "8080"
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-africensus}:${POSTGRES_PASSWORD:-africensus}@postgres:5432/${POSTGRES_DB:-africensus}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200,http://localhost:8000,http://127.0.0.1:8000}"
      FRONTEND_DIST: "${FRONTEND_DIST:-frontend/dist/africensus-link/browser}"
      DEFAULT_LANGUAGE: "${DEFAULT_LANGUAGE:-fr}"
      SUPPORTED_LANGUAGES: "${SUPPORTED_LANGUAGES:-fr,en}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,0.0.0.0,testserver}"
      SECURITY_HEADERS_ENABLED: "${SECURITY_HEADERS_ENABLED:-true}"
      AUTH_RATE_LIMIT_ATTEMPTS: "${AUTH_RATE_LIMIT_ATTEMPTS:-5}"
      AUTH_RATE_LIMIT_WINDOW_SECONDS: "${AUTH_RATE_LIMIT_WINDOW_SECONDS:-300}"
      AFRICENSUS_PASSWORD_ITERATIONS: "${AFRICENSUS_PASSWORD_ITERATIONS:-210000}"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health').read()" ]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  africensus_postgres_data:
